# Hourly results auto-sync: poll ESPN's public scoreboard, enter new finished
# group results, test, commit, rebuild, deploy. Anything needing a human
# (knockout finals, score conflicts, mapping refusals, overdue fixtures) fails
# the run AFTER commit+deploy so GitHub emails the owner. See OPS.md.
name: results-sync

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Build & deploy even if no new results"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: results-sync
  cancel-in-progress: false

env:
  # GitHub forces JS actions onto Node 24 from 2026-06-16 (mid-tournament).
  # Opt in now so the cutover can't change behavior unattended; validated via
  # workflow_dispatch on 2026-06-12.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sync:
    # Ops crons run only on the canonical public repo: a mirror (e.g. the
    # private dev remote) would double-alert, double-commit to itself and
    # double-deploy. Manual dispatch still works anywhere.
    if: github.event_name != 'schedule' || github.repository == 'teemula35/punditbench'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Manual runs double as diagnostics: prove ESPN answers GitHub's runners
      # (the hourly sync only calls it when a fixture is actually pending).
      - name: Probe ESPN reachability
        if: github.event_name == 'workflow_dispatch'
        run: >
          curl -sf -A "punditbench-results-sync (https://github.com/teemula35/punditbench)"
          "https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates=20260611"
          -o /dev/null -w "ESPN HTTP %{http_code}\n"

      - name: Sync results from ESPN
        id: sync
        run: npm run sync-results

      - name: Tests
        if: steps.sync.outputs.changed == 'true'
        run: npm test

      - name: Commit & push
        if: steps.sync.outputs.changed == 'true'
        env:
          ENTERED: ${{ steps.sync.outputs.entered }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json data/competitions
          git commit -m "Results sync: $ENTERED"
          git pull --rebase origin main
          git push

      - name: Build
        if: steps.sync.outputs.changed == 'true' || inputs.force_deploy
        env:
          PB_BRIEF_CHECKOUT_URL: ${{ secrets.PB_BRIEF_CHECKOUT_URL }}
          PB_BRIEF_SELLER_NAME: ${{ secrets.PB_BRIEF_SELLER_NAME }}
          PB_BRIEF_SELLER_ADDRESS: ${{ secrets.PB_BRIEF_SELLER_ADDRESS }}
          PB_BRIEF_SELLER_ID: ${{ secrets.PB_BRIEF_SELLER_ID }}
          PB_BRIEF_SUPPORT_EMAIL: ${{ secrets.PB_BRIEF_SUPPORT_EMAIL }}
          PB_BRIEF_VAT_NOTICE: ${{ secrets.PB_BRIEF_VAT_NOTICE }}
          PB_BRIEF_DELIVERY_METHOD: ${{ secrets.PB_BRIEF_DELIVERY_METHOD }}
          PB_BRIEF_TERMS_URL: ${{ secrets.PB_BRIEF_TERMS_URL }}
          PB_BRIEF_PRIVACY_URL: ${{ secrets.PB_BRIEF_PRIVACY_URL }}
          PB_BRIEF_REFUNDS_URL: ${{ secrets.PB_BRIEF_REFUNDS_URL }}
          PB_VALUE_LINES_CHECKOUT_URL: ${{ secrets.PB_VALUE_LINES_CHECKOUT_URL }}
          PB_VALUE_LINES_STRIPE_ACCOUNT_ID: ${{ secrets.PB_VALUE_LINES_STRIPE_ACCOUNT_ID }}
          PB_VALUE_LINES_STRIPE_PRODUCT_ID: ${{ secrets.PB_VALUE_LINES_STRIPE_PRODUCT_ID }}
          PB_VALUE_LINES_STRIPE_PRICE_ID: ${{ secrets.PB_VALUE_LINES_STRIPE_PRICE_ID }}
          PB_VALUE_LINES_STRIPE_UNIT_AMOUNT_CENTS: ${{ secrets.PB_VALUE_LINES_STRIPE_UNIT_AMOUNT_CENTS }}
          PB_VALUE_LINES_STRIPE_CURRENCY: ${{ secrets.PB_VALUE_LINES_STRIPE_CURRENCY }}
          PB_VALUE_LINES_STRIPE_INTERVAL: ${{ secrets.PB_VALUE_LINES_STRIPE_INTERVAL }}
          PB_VALUE_LINES_STRIPE_MODE: ${{ secrets.PB_VALUE_LINES_STRIPE_MODE }}
          PB_VALUE_LINES_SELLER_LEGAL_NAME: ${{ secrets.PB_VALUE_LINES_SELLER_LEGAL_NAME }}
          PB_VALUE_LINES_SELLER_BUSINESS_ID: ${{ secrets.PB_VALUE_LINES_SELLER_BUSINESS_ID }}
          PB_VALUE_LINES_SELLER_ADDRESS_LINE_1: ${{ secrets.PB_VALUE_LINES_SELLER_ADDRESS_LINE_1 }}
          PB_VALUE_LINES_SELLER_POSTAL_CODE: ${{ secrets.PB_VALUE_LINES_SELLER_POSTAL_CODE }}
          PB_VALUE_LINES_SELLER_CITY: ${{ secrets.PB_VALUE_LINES_SELLER_CITY }}
          PB_VALUE_LINES_SELLER_COUNTRY_CODE: ${{ secrets.PB_VALUE_LINES_SELLER_COUNTRY_CODE }}
          PB_VALUE_LINES_TAX_NOTICE: ${{ secrets.PB_VALUE_LINES_TAX_NOTICE }}
          PB_VALUE_LINES_SUPPORT_EMAIL: ${{ secrets.PB_VALUE_LINES_SUPPORT_EMAIL }}
          PB_VALUE_LINES_CONTACT_URL: ${{ secrets.PB_VALUE_LINES_CONTACT_URL }}
          PB_VALUE_LINES_DELIVERY_METHOD: ${{ secrets.PB_VALUE_LINES_DELIVERY_METHOD }}
          PB_VALUE_LINES_EMAIL_PROVIDER: ${{ secrets.PB_VALUE_LINES_EMAIL_PROVIDER }}
          PB_VALUE_LINES_EMAIL_SENDER: ${{ secrets.PB_VALUE_LINES_EMAIL_SENDER }}
          PB_VALUE_LINES_EMAIL_SENDING_DOMAIN: ${{ secrets.PB_VALUE_LINES_EMAIL_SENDING_DOMAIN }}
          PB_VALUE_LINES_EMAIL_DOMAIN_VERIFIED: ${{ secrets.PB_VALUE_LINES_EMAIL_DOMAIN_VERIFIED }}
          PB_VALUE_LINES_TERMS_URL: ${{ secrets.PB_VALUE_LINES_TERMS_URL }}
          PB_VALUE_LINES_PRIVACY_URL: ${{ secrets.PB_VALUE_LINES_PRIVACY_URL }}
          PB_VALUE_LINES_REFUNDS_URL: ${{ secrets.PB_VALUE_LINES_REFUNDS_URL }}
          PB_VALUE_LINES_RESPONSIBLE_PLAY_URL: ${{ secrets.PB_VALUE_LINES_RESPONSIBLE_PLAY_URL }}
          PB_VALUE_LINES_SERVICE_BASE_URL: ${{ secrets.PB_VALUE_LINES_SERVICE_BASE_URL }}
          PB_VALUE_LINES_RETURN_URL: ${{ secrets.PB_VALUE_LINES_RETURN_URL }}
          PB_VALUE_LINES_CANCEL_URL: ${{ secrets.PB_VALUE_LINES_CANCEL_URL }}
          PB_VALUE_LINES_ACTIVATION: ${{ secrets.PB_VALUE_LINES_ACTIVATION }}
        run: npm run build

      - name: Deploy
        if: steps.sync.outputs.changed == 'true' || inputs.force_deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PUNDITBENCH }}
          channelId: live
          projectId: punditbench

      - name: Raise alerts
        if: steps.sync.outputs.alerts != ''
        env:
          ALERTS: ${{ steps.sync.outputs.alerts }}
        run: |
          echo "::error::$ALERTS"
          exit 1
